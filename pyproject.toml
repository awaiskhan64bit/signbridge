[project]
name = "signbridge"
version = "0.1.0"
description = "Offline desktop app that reads sign language from your camera and speaks it out loud."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Awais Khan" }]
keywords = ["sign-language", "mediapipe", "tts", "accessibility", "offline", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "PySide6>=6.7,<7",
    # mediapipe 1.1.0 pulls in sounddevice 0.5.x and opencv-contrib-python,
    # which is why neither is pinned here separately: two OpenCV wheels in one
    # environment fight over the same cv2 module.
    "mediapipe>=1.1,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Piper 1.3+ is GPL-3.0. See docs/licensing.md before distributing a build.
tts = ["piper-tts>=1.8"]
tts-fallback = ["pyttsx3>=2.90"]

[project.scripts]
signbridge = "signbridge.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signbridge"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
